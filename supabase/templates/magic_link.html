<!-- S19, DEC-61: the log-in email, used only by the moderator console (/mod); players log in with
     a password and get no email. The link always goes to our own {{ .SiteURL }}/mod, never to a
     redirect the request named (review F4). The one-time token rides in the URL fragment, so it
     never reaches a server or CDN log (review F5), and the page finishes only on a tap, so a mail
     scanner that opens the link uses nothing up. Paste into the hosted dashboard too
     (Auth > Email Templates > Magic Link). -->
<h2>Log in to the Clout City moderator console</h2>
<p>Tap the button to log in on this device:</p>
<p><a href="{{ .SiteURL }}/mod#token_hash={{ .TokenHash }}&type=email&email={{ .Email }}">Log me in</a></p>
<p>The link works once and runs out in an hour. Didn't ask to log in? Ignore this email.</p>
